<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crypto Chart</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            background: #0a0a0a;
            color: #fff;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        #header {
            background: #1a1a1a;
            padding: 10px 16px;
            text-align: center;
            border-bottom: 1px solid #333;
            font-weight: bold;
            font-size: 14px;
        }
        #chart-container {
            flex: 1;
            min-height: 0;
        }
        #chart-container iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
        #info-panel {
            padding: 12px 16px;
            background: #1a1a1a;
            border-top: 1px solid #333;
            font-size: 13px;
            line-height: 1.5;
        }
        .info-row {
            display: flex;
            justify-content: space-between;
            padding: 4px 0;
        }
        .info-label { color: #888; }
        .info-value { color: #fff; font-weight: bold; }
        .green { color: #4ade80; }
        .red { color: #f87171; }
        #actions {
            display: flex;
            gap: 6px;
            padding: 8px;
            background: #1a1a1a;
            border-top: 1px solid #333;
            overflow-x: auto;
        }
        .action-btn {
            padding: 8px 14px;
            border-radius: 8px;
            border: 1px solid #333;
            background: #2563eb;
            color: #fff;
            font-size: 12px;
            cursor: pointer;
            white-space: nowrap;
            text-decoration: none;
        }
        #loading {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #888;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div id="header">📊 Анализ токена</div>
    <div id="chart-container">
        <div id="loading">Загрузка...</div>
    </div>
    <div id="info-panel">
        <div class="info-row">
            <span class="info-label">Токен</span>
            <span class="info-value" id="token-address">Загрузка...</span>
        </div>
        <div class="info-row">
            <span class="info-label">Цена</span>
            <span class="info-value" id="token-price">...</span>
        </div>
        <div class="info-row">
            <span class="info-label">Ликвидность</span>
            <span class="info-value" id="token-liquidity">...</span>
        </div>
        <div class="info-row">
            <span class="info-label">Market Cap</span>
            <span class="info-value" id="token-mcap">...</span>
        </div>
        <div class="info-row">
            <span class="info-label">Объём 24ч</span>
            <span class="info-value" id="token-volume">...</span>
        </div>
        <div class="info-row">
            <span class="info-label">Изменение 24ч</span>
            <span class="info-value" id="token-change">...</span>
        </div>
    </div>
    <div id="actions">
        <a class="action-btn" id="dexscreener-link" href="#" target="_blank">🔗 Dexscreener</a>
        <a class="action-btn" id="solscan-link" href="#" target="_blank">🔍 Solscan</a>
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        const tokenAddress = params.get('token') || '6YFxato32MVMrK1mQwYyaLawGt6FhB5XGDWavmDppump';
        
        document.getElementById('token-address').textContent = tokenAddress.slice(0, 8) + '...' + tokenAddress.slice(-6);
        document.getElementById('dexscreener-link').href = 'https://dexscreener.com/solana/' + tokenAddress;
        document.getElementById('solscan-link').href = 'https://solscan.io/token/' + tokenAddress;

        // Загружаем график Dexscreener
        function loadChart() {
            const container = document.getElementById('chart-container');
            const iframe = document.createElement('iframe');
            iframe.src = 'https://dexscreener.com/solana/' + tokenAddress + '?embed=1&theme=dark&info=0';
            iframe.onload = function() {
                document.getElementById('loading').style.display = 'none';
            };
            container.appendChild(iframe);
        }

        // Загружаем данные токена
        async function loadTokenInfo() {
            try {
                const response = await fetch('https://api.dexscreener.com/latest/dex/tokens/' + tokenAddress);
                const data = await response.json();
                const pairs = data.pairs || [];
                
                if (pairs.length > 0) {
                    const pair = pairs[0];
                    const price = parseFloat(pair.priceUsd || 0);
                    const liquidity = pair.liquidity?.usd || 0;
                    const mcap = pair.fdv || 0;
                    const volume = pair.volume?.h24 || 0;
                    const priceChange = pair.priceChange?.h24 || 0;

                    document.getElementById('token-price').textContent = '$' + (price < 0.00001 ? price.toFixed(10) : price.toFixed(6));
                    document.getElementById('token-liquidity').textContent = '$' + Number(liquidity).toLocaleString();
                    document.getElementById('token-mcap').textContent = '$' + Number(mcap).toLocaleString();
                    document.getElementById('token-volume').textContent = '$' + Number(volume).toLocaleString();
                    
                    const changeEl = document.getElementById('token-change');
                    changeEl.textContent = (priceChange >= 0 ? '+' : '') + priceChange.toFixed(2) + '%';
                    changeEl.className = 'info-value ' + (priceChange >= 0 ? 'green' : 'red');
                } else {
                    document.getElementById('token-price').textContent = 'Нет данных';
                }
            } catch (e) {
                console.error('Error:', e);
            }
        }

        loadChart();
        loadTokenInfo();
        setInterval(loadTokenInfo, 30000);
    </script>
</body>
</html>
