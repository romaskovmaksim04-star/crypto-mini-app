<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crypto Chart</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            background: #0a0a0a;
            color: #fff;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        #header {
            background: #1a1a1a;
            padding: 10px 16px;
            text-align: center;
            border-bottom: 1px solid #333;
            font-weight: bold;
            font-size: 14px;
        }
        #chart-container {
            flex: 1;
            min-height: 0;
        }
        #timeframes {
            display: flex;
            gap: 4px;
            padding: 8px;
            background: #1a1a1a;
            overflow-x: auto;
            border-top: 1px solid #333;
        }
        .tf-btn {
            padding: 6px 12px;
            border-radius: 6px;
            border: 1px solid #333;
            background: #0a0a0a;
            color: #aaa;
            font-size: 12px;
            cursor: pointer;
            white-space: nowrap;
        }
        .tf-btn.active {
            background: #2563eb;
            color: #fff;
            border-color: #2563eb;
        }
        #info-panel {
            padding: 12px 16px;
            background: #1a1a1a;
            border-top: 1px solid #333;
            font-size: 13px;
            line-height: 1.5;
        }
        .info-row {
            display: flex;
            justify-content: space-between;
            padding: 4px 0;
        }
        .info-label { color: #888; }
        .info-value { color: #fff; font-weight: bold; }
        .green { color: #4ade80; }
        .red { color: #f87171; }
        #loading {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #888;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div id="header">📊 График токена</div>
    <div id="chart-container">
        <div id="loading">Загрузка графика...</div>
    </div>
    <div id="timeframes">
        <button class="tf-btn" onclick="setTimeframe('1')">1м</button>
        <button class="tf-btn" onclick="setTimeframe('5')">5м</button>
        <button class="tf-btn active" onclick="setTimeframe('15')">15м</button>
        <button class="tf-btn" onclick="setTimeframe('30')">30м</button>
        <button class="tf-btn" onclick="setTimeframe('60')">1ч</button>
        <button class="tf-btn" onclick="setTimeframe('240')">4ч</button>
        <button class="tf-btn" onclick="setTimeframe('1D')">1д</button>
    </div>
    <div id="info-panel">
        <div class="info-row">
            <span class="info-label">Адрес токена</span>
            <span class="info-value" id="token-address">Загрузка...</span>
        </div>
        <div class="info-row">
            <span class="info-label">Цена</span>
            <span class="info-value" id="token-price">...</span>
        </div>
        <div class="info-row">
            <span class="info-label">Ликвидность</span>
            <span class="info-value" id="token-liquidity">...</span>
        </div>
        <div class="info-row">
            <span class="info-label">Market Cap</span>
            <span class="info-value" id="token-mcap">...</span>
        </div>
        <div class="info-row">
            <span class="info-label">Объём (24ч)</span>
            <span class="info-value" id="token-volume">...</span>
        </div>
        <div class="info-row">
            <span class="info-label">Изменение (24ч)</span>
            <span class="info-value" id="token-change">...</span>
        </div>
    </div>

    <script>
        // Получаем адрес токена из URL параметров
        const params = new URLSearchParams(window.location.search);
        const tokenAddress = params.get('token') || '6YFxato32MVMrK1mQwYyaLawGt6FhB5XGDWavmDppump';
        
        // Показываем адрес
        document.getElementById('token-address').textContent = tokenAddress.slice(0, 8) + '...' + tokenAddress.slice(-6);

        let currentTimeframe = '15';
        let widget = null;

        function setTimeframe(tf) {
            currentTimeframe = tf;
            
            // Обновляем кнопки
            document.querySelectorAll('.tf-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            
            // Обновляем график
            loadChart();
        }

        function loadChart() {
            document.getElementById('chart-container').innerHTML = '';
            document.getElementById('loading').style.display = 'flex';
            
            // Создаём контейнер для виджета
            const container = document.createElement('div');
            container.id = 'tv-widget';
            container.style.width = '100%';
            container.style.height = '100%';
            document.getElementById('chart-container').appendChild(container);
            
            // TradingView виджет
            widget = new TradingView.widget({
                "width": "100%",
                "height": "100%",
                "symbol": "DEXSCREENER:" + tokenAddress,
                "interval": currentTimeframe,
                "timezone": "Etc/UTC",
                "theme": "dark",
                "style": "1",
                "locale": "ru",
                "toolbar_bg": "#1a1a1a",
                "enable_publishing": false,
                "hide_top_toolbar": true,
                "hide_legend": false,
                "save_image": false,
                "container_id": "tv-widget",
                "studies": ["MASimple@tv-basicstudies"],
                "overrides": {
                    "mainSeriesProperties.candleStyle.upColor": "#4ade80",
                    "mainSeriesProperties.candleStyle.downColor": "#f87171",
                    "mainSeriesProperties.candleStyle.borderUpColor": "#4ade80",
                    "mainSeriesProperties.candleStyle.borderDownColor": "#f87171",
                    "mainSeriesProperties.candleStyle.wickUpColor": "#4ade80",
                    "mainSeriesProperties.candleStyle.wickDownColor": "#f87171"
                }
            });

            widget.onChartReady(function() {
                document.getElementById('loading').style.display = 'none';
            });
        }

        // Загрузка данных токена с Dexscreener
        async function loadTokenInfo() {
            try {
                const response = await fetch('https://api.dexscreener.com/latest/dex/tokens/' + tokenAddress);
                const data = await response.json();
                const pairs = data.pairs || [];
                
                if (pairs.length > 0) {
                    const pair = pairs[0];
                    const price = parseFloat(pair.priceUsd || 0);
                    const liquidity = pair.liquidity?.usd || 0;
                    const mcap = pair.fdv || 0;
                    const volume = pair.volume?.h24 || 0;
                    const priceChange = pair.priceChange?.h24 || 0;

                    document.getElementById('token-price').textContent = '$' + (price < 0.00001 ? price.toFixed(10) : price.toFixed(6));
                    document.getElementById('token-liquidity').textContent = '$' + Number(liquidity).toLocaleString();
                    document.getElementById('token-mcap').textContent = '$' + Number(mcap).toLocaleString();
                    document.getElementById('token-volume').textContent = '$' + Number(volume).toLocaleString();
                    
                    const changeEl = document.getElementById('token-change');
                    changeEl.textContent = (priceChange >= 0 ? '+' : '') + priceChange.toFixed(2) + '%';
                    changeEl.className = 'info-value ' + (priceChange >= 0 ? 'green' : 'red');
                } else {
                    document.getElementById('token-price').textContent = 'Нет данных';
                }
            } catch (e) {
                document.getElementById('token-price').textContent = 'Ошибка';
            }
        }

        // Загружаем всё
        loadChart();
        loadTokenInfo();

        // Обновляем инфу каждые 30 секунд
        setInterval(loadTokenInfo, 30000);
    </script>
    <script src="https://s3.tradingview.com/tv.js"></script>
</body>
</html>
